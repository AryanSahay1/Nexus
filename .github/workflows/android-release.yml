name: Android release APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # AGP 8 + react-native-app-auth need JDK 17 specifically; JDK 21
      # fails on the JdkImageTransform inside compileDebugJavaWithJavac.
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools ndk;25.1.8937393'

      - name: Install npm deps
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Run unit tests + typecheck
        run: |
          npx tsc --noEmit
          npx eslint src __tests__ app --ext .ts,.tsx --max-warnings 0
          npx jest --colors=false

      - name: Build APK
        env:
          EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID }}
        run: ./scripts/build-android-apk.sh debug

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-android-debug
          path: release/nexus-*-android-debug.apk
          if-no-files-found: error

      - name: Attach APK to GitHub release (tag-only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/nexus-*-android-debug.apk
            release/nexus-*-android-debug.apk.sha256
          generate_release_notes: true

name: Android Release

# Triggered by pushing a tag matching `v*` (e.g. `git tag v1.0.0 && git
# push origin v1.0.0`). Builds the Android release APK from the same
# code-base CI just verified, attaches it to the GitHub Release, and
# publishes a sha256 checksum next to it so end users can verify the
# download.
#
# REQUIRED REPO SECRETS (Settings → Secrets and variables → Actions):
#
#   EXPO_PUBLIC_GOOGLE_CLIENT_ID
#     Google OAuth Client ID (e.g. `xxxxx.apps.googleusercontent.com`).
#     Read by the Vault screen at runtime via `process.env`. Without it,
#     the "Connect Google" affordance shows a yellow setup hint instead
#     of the OAuth flow. Not a secret strictly speaking — but kept in
#     repo secrets so it isn't checked into the public binary URL.
#
#   ANDROID_KEYSTORE_BASE64    (optional — only required for Play Store
#                              uploads; the release APK still builds with
#                              the debug keystore signature when omitted,
#                              suitable for sideloading.)
#   ANDROID_KEYSTORE_PASSWORD  (optional, paired with the above)
#   ANDROID_KEY_ALIAS          (optional, paired with the above)
#   ANDROID_KEY_PASSWORD       (optional, paired with the above)

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android-release:
    name: Build + publish Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Sanity-check Expo native modules
        run: npx expo install --check

      - name: Expo prebuild (Android)
        env:
          EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID }}
        run: npx expo prebuild --platform android --no-install --clean

      - name: Decode upload keystore (if configured)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload.keystore

      - name: Gradle assembleRelease
        env:
          EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Compute sha256 checksum
        id: checksum
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          echo "$SHA  app-release.apk" > "$APK.sha256"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Rename APK to nexus-release.apk
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk        nexus-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk.sha256 nexus-release.apk.sha256

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nexus-release.apk
            nexus-release.apk.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Android release APK for **${{ github.ref_name }}**.

            sha256: `${{ steps.checksum.outputs.sha }}`

            Verify before installing:
            ```
            sha256sum -c nexus-release.apk.sha256
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
